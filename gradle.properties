# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric（26.2 未混淆，无需 mappings）
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.155.2+26.2

# Mod Properties
# 版本号 = 上游基线 + 构建元数据（用 '+' 而非 '-'，保证 SemVer 比较时不破坏上游版本约束）
mod_version=2.6.1.2+mc26.2
maven_group=cn.sh1rocu
archives_base_name=simplebedrockmodel-fabric

# Dependencies
# MAE（动画姿态 API，SBM 依赖 BaseKeyframe）
mae_version=1.1.4
