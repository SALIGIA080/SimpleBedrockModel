plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/simplebedrockmodel.accesswidener")
    // 26.1+：Minecraft 不再混淆，mixin AP 需要 mappings 才能生成 refmap，
    // 而 26.1+ 没有 mappings，因此必须禁用 legacy mixin AP。
    // mixin {
    //     useLegacyMixinAp = true
    //     defaultRefmapName = "simplebedrockmodel.refmap.json"
    // }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    // ================================================================
    // 从 26.1+: Minecraft 不再混淆，Loom 使用未混淆模式
    // 因此不再需要 mappings 依赖
    // modImplementation → implementation (因为不再需要 mod 重映射)
    // modCompileOnly → compileOnly
    // modRuntimeOnly → runtimeOnly
    // modApi → api
    // ================================================================

    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings needed — 26.1+ uses unobfuscated Minecraft
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    // Forge Config API Port — 26.2 有对应版本
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1"

    // MAE（动画姿态 API）
    include(implementation("com.maydaymemory:mae:${project.mae_version}")) {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    // ============================================================
    // 以下第三方兼容依赖在 26.2 暂无对应版本，先禁用；后续逐个核实
    // ============================================================

    // Sodium — 26.2 版本待确认（SBM 有 SodiumCompat 适配层）
    // implementation "maven.modrinth:sodium:mc26.2-..."

    // Accelerated Rendering — 26.2 版本待确认（SBM 有 AcceleratedRenderingCompat 适配层）
    // implementation "maven.modrinth:accrelatedrendering-refabricated:..."
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
