name: build

on:
  push:
    branches: [ main, '26.2' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Full build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBedrockModel-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error
